services:
  postgres:
    image: postgres:16-alpine
    container_name: hkbp-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hkbp_platform
      POSTGRES_USER: hkbp
      POSTGRES_PASSWORD: hkbp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hkbp -d hkbp_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
